name: Update MRS and MMDB

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *' # 每天早上6点执行 (UTC+8)

jobs:
  update-ruleset:
    runs-on: ubuntu-latest

    steps:
    - name: Set variables
      run: |
        echo "GOAMD64=v3" >> $GITHUB_ENV
        echo "BUILDTIME=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
      shell: bash

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Checkout Energetic3906/domain-list-community
      uses: actions/checkout@v4
      with:
        repository: Energetic3906/domain-list-community
        ref: master
        path: community
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: false # 修改：关闭自动缓存以消除 "Restore cache failed" 警告

    - name: Install Dependencies
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        python3 -m pip install --upgrade pip
        pip3 install mmdb_writer netaddr

    - name: Get latest release version
      id: get_release
      run: |
        latest_version=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.tag_name')
        echo "LATEST_VERSION=${latest_version}" >> $GITHUB_ENV

    - name: Download latest mihomo release
      run: |
        download_url="https://github.com/MetaCubeX/mihomo/releases/download/${{ env.LATEST_VERSION }}/mihomo-linux-amd64-${{ env.LATEST_VERSION }}.deb"
        wget $download_url -O mihomo.deb
        sudo dpkg -i mihomo.deb

    - name: Download IP lists
      run: |
        # IPv4
        wget https://raw.githubusercontent.com/gaoyifan/china-operator-ip/refs/heads/ip-lists/china.txt -O china.txt
        wget https://ispip.clang.cn/all_cn.txt -O all_cn.txt
        # IPv6
        wget https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists/china6.txt -O china6.txt
        wget https://ispip.clang.cn/all_cn_ipv6.txt -O all_cn_ipv6.txt

    - name: Merge and filter CIDR
      run: |
        source .venv/bin/activate
        # 确保你的仓库根目录下有 merge_and_filter_cidr.py 文件
        python3 merge_and_filter_cidr.py china.txt all_cn.txt china6.txt all_cn_ipv6.txt
        cat merged_ipv4.txt merged_ipv6.txt | sort -u > CN-ip-cidr.txt
        rm merged_ipv4.txt merged_ipv6.txt

    - name: Convert txt/yaml to mrs
      run: |
        mihomo convert-ruleset ipcidr text CN-ip-cidr.txt CN-ip-cidr.mrs

    - name: Convert CN-ip-cidr.txt to MMDB format
      run: |
        source .venv/bin/activate
        # 确保你的仓库根目录下有 convert_to_mmdb.py 文件
        python3 convert_to_mmdb.py CN-ip-cidr.txt Country.mmdb
    
    ## Geosite build
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install tldextract
      run: pip install tldextract

    - name: Build geosite.list
      run: |
        # 1. 生成原始 geosite.list（不再在这里排除关键词，交给 Python 统一处理）
        curl -sSL https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/refs/heads/master/accelerated-domains.china.conf \
          | grep '^server=' \
          | sed 's/^server=\/\([^\/]*\)\/.*/DOMAIN-SUFFIX,\1/' \
          > geosite.list

        # 2. 下载 Umbrella top-1m
        curl -sSL http://s3-us-west-1.amazonaws.com/umbrella-static/top-1m.csv.zip -o top-1m.csv.zip
        unzip -o -q top-1m.csv.zip

        # 3. 用 Python 过滤：排除关键词 + 只保留主域名在 top-1m 中的条目 + 手动域名
        cat > filter_geosite.py << 'PYEOF'
        import csv
        import ipaddress
        import tldextract

        extractor = tldextract.TLDExtract(suffix_list_urls=())

        TOP1M_FILE = 'top-1m.csv'
        GEOSITE_FILE = 'geosite.list'
        OUTPUT_FILE = 'geosite.list'

        # ============================================================
        # 要排除的域名/关键词（子串匹配）使用coudfalre https://radar.cloudflare.com/zh-cn/domains 去掉前面的国外访问域名
        # ============================================================
        EXCLUDE_PATTERNS = [
            ".microsoft.com",
            ".adobe.com",
            "pikpak",
            "deepseek",
            ".top",
            ".wang",
            ".bigolive.tv",
            ".imolive.tv",
            ".windowsupdate.com",
            ".tiktokrow-cdn.com",
            ".live.com",
        ]

        # ============================================================
        # 手动添加的域名/后缀，直接绕过 top-1m 过滤，无条件加入输出
        # 例如 "cn" 会生成 DOMAIN-SUFFIX,cn，匹配所有 .cn 域名
        # ============================================================
        MANUAL_DOMAINS = [
            "cn",
            "djigate.com",
            "djiits.com",
            "xn--fiqs8s",   # .中国（简体）
            "xn--fiqz9s",   # .中國（繁体）
            "xn--55qx5d",   # .公司
            "xn--io0a7i",   # .网络
            "xn--zfr164b",  # .政务
            "xn--55qw42g",  # .公益
        ]

        def is_excluded(domain: str) -> bool:
            return any(p in domain for p in EXCLUDE_PATTERNS)

        # 加载 top-1m 排名
        rank = {}
        with open(TOP1M_FILE, 'r', encoding='utf-8') as f:
            sample = f.read(1024)
            f.seek(0)
            delimiter = ',' if ',' in sample else None
            if delimiter:
                reader = csv.reader(f, delimiter=delimiter)
            else:
                reader = (line.split() for line in f)

            for row in reader:
                if not row or len(row) < 2:
                    continue
                if row[0].lower() in ('rank', 'ranking'):
                    continue
                try:
                    rank_val = int(row[0].strip())
                    domain_val = row[1].strip().lower()
                    rank[domain_val] = rank_val
                except ValueError:
                    continue

        print(f"Loaded {len(rank)} domains from top-1m.csv")

        seen = {}
        excluded_count = 0
        with open(GEOSITE_FILE, 'r', encoding='utf-8') as f:
            for line in f:
                line = line.strip()
                if not line.startswith('DOMAIN-SUFFIX,'):
                    continue
                domain = line.split(',', 1)[1].strip().lower()

                # 排除关键词
                if is_excluded(domain):
                    excluded_count += 1
                    continue

                # 过滤反向 DNS 和纯 IP
                if domain.endswith('.in-addr.arpa') or domain.endswith('.ip6.arpa'):
                    continue
                try:
                    ipaddress.ip_address(domain)
                    continue
                except ValueError:
                    pass

                # 提取主域名（eTLD+1）
                ext = extractor(domain)
                root = ext.registered_domain
                if not root:
                    continue

                # 只保留主域名在 top-1m 中的条目
                if root in rank:
                    if root not in seen:
                        seen[root] = rank[root]

        # 手动域名统一转小写、去重
        manual_set = []
        manual_seen = set()
        for d in MANUAL_DOMAINS:
            d = d.strip().lower()
            if d and d not in manual_seen:
                manual_seen.add(d)
                manual_set.append(d)

        # 输出：先写手动域名，再按排名写过滤后的域名
        with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
            for d in manual_set:
                f.write(f"DOMAIN-SUFFIX,{d}\n")
            for root in sorted(seen.keys(), key=lambda x: seen[x]):
                if root in manual_seen:
                    continue  # 避免与手动域名重复
                f.write(f"DOMAIN-SUFFIX,{root}\n")

        print(f"Excluded by patterns: {excluded_count}")
        print(f"Manual domains added: {len(manual_set)}")
        print(f"Filtered and saved {len(seen)} domains to {OUTPUT_FILE}")
        PYEOF

        python filter_geosite.py

    - name: Commit and push mrs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "101653181+github-actions[bot]@users.noreply.github.com"
        git add all_cn.txt all_cn_ipv6.txt CN-ip-cidr.mrs Country.mmdb geosite.list
        
        # 使用开头定义的 BUILDTIME 变量，保证一致性
        commit_message="Update mrs and mmdb and Geosite Data on ${{ env.BUILDTIME }}"
        
        if [[ -n "$(git status --porcelain)" ]]; then
          git commit -m "$commit_message"
          git push -u origin main
        else
          echo "No changes to commit."
        fi